name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ============================================
  # RESPOND - React to @claude mentions
  # ============================================
  claude-respond:
    name: Claude Respond
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Job-scoped token: no Claude App installation or OIDC exchange.
          github_token: ${{ github.token }}
          bot_id: "41898282"
          bot_name: "github-actions[bot]"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  # ============================================
  # REVIEW - Auto-review PRs on open/push
  # ============================================
  claude-review:
    name: Claude Review
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Review
        uses: anthropics/claude-code-action@v1
        with:
          # Job-scoped token: no Claude App installation or OIDC exchange.
          github_token: ${{ github.token }}
          bot_id: "41898282"
          bot_name: "github-actions[bot]"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Agent mode needs explicit tools to register the inline-comment server.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Repository: ${{ github.repository }}
            Pull request: ${{ github.event.pull_request.number }}
            Head SHA: ${{ github.event.pull_request.head.sha }}
            Use `gh pr diff` and `gh pr view` for this exact pull request.
            Always post a summary using `gh pr comment` on this pull request, including the reviewed head SHA,
            even when no actionable findings are found. Report any tool limitations honestly.
            Review this pull request for:
            1. Correctness - logic errors, edge cases, off-by-one errors
            2. Security - dependency risks, unsafe patterns, data exposure
            3. API design - breaking changes, backward compatibility
            4. Code quality - dead code, unclear naming, missing error handling

            This is Lantern, an open-source TypeScript monorepo (pnpm, tsup, vitest) for AI observability.
            This is a public OSS project — pay attention to public API surface, documentation accuracy, and semver implications.
            Focus on actionable findings. Skip style nits unless they affect readability.
            Post findings as inline review comments on specific lines.
